# ============================================================
# AutoNovel-CN 配置文件
# 用户可编辑，修改后立即生效
# 版本: v0.9.4 | 更新: 2026-05-24 17:03
# ============================================================

# ============================================================
# 品类与风格配置
# ============================================================
# 品类（决定世界观模板、市场定位）
# 可选：都市脑洞 / 重生穿越 / 玄幻仙侠 / 豪门总裁 / 年代种田 / 废土末世 / 游戏竞技
#       异界后宫 / 系统流 / 种田经营 / 古言宫斗 / 悬疑推理 / 无限流 / 修真炼丹 / 末世囤物资 / 军事谍战
genre: "种田经营"

# 风格标签（可多选，决定全流程的"味道"）
# 可选：搞笑 / 热血 / 悬疑 / 暗黑 / 后宫 / 纯爱 / 脑洞 / 群像 / 复仇 / 治愈 / 讽刺 / 冒险
# 注意：后宫与纯爱互斥，悬疑与治愈需注意平衡
tags:
  - "群像"
  - "冒险"
  - "搞笑"
# ============================================================
# 生成参数
# ============================================================
# 目标总卷数（0 = 让AI自由规划，按剧情弧自然分卷）
target_volumes: 0

# 每章目标字数（建议2000-3000）
words_per_chapter: 2000

# 每章小爽点数（建议2-4个）
shuang_per_chapter: 3

# ============================================================
# 种子生成参数
# ============================================================
# 一次生成多少个种子概念
seed_count: 10

# ============================================================
# API 配置
# ============================================================
# 生成类任务使用的主力API
writer_api: "deepseek_v3"

# 审核/评估类任务使用的API
judge_api: "deepseek_r1"

# ============================================================
# Pipeline 控制
# ============================================================
# 评估不通过时是否自动修订
auto_revise: true

# 最大修订轮数（超过则放弃该章节）
max_revision_rounds: 5

# 普通章节最低合格分数（1-10分）
min_chapter_score: 5.5

# 黄金三章（前3章）合格分数，要求更高
golden_chapter_score: 7.5

# ============================================================
# 卷级配置
# ============================================================
# 每卷默认章数（实际由大纲决定）
chapters_per_volume: 30

# ============================================================
# 典据 GC 配置
# ============================================================
# 是否在卷间执行典据GC
canon_gc_enabled: true

# 是否启用冷库归档
canon_archive_enabled: true

# ============================================================
# Foundation 循环配置
# ============================================================
# Foundation 基础评分达标线（1-10分）
foundation_pass_score: 7.5

# 设定评分达标线（1-10分）
lore_pass_score: 7.0

# Foundation 评估最大轮数
max_foundation_rounds: 5

# ============================================================
# 输出配置
# ============================================================
# 输出目录（相对于项目根目录）
output_dir: "outputs"

# 生成的种子保存文件名
seed_file: "seed.md"

# 生成的世界观保存文件名
world_file: "world.md"

# 生成的角色保存文件名
characters_file: "characters.md"

# 生成的大纲保存文件名
outline_file: "outline.md"

# 典据数据库文件名
canon_file: "canon.md"

# 核心悬疑与终极底牌文件名
mystery_file: "mystery.md"

# 语声档案文件名
voice_file: "voice.md"

# ============================================================
# Token 预算控制
# ============================================================
# 全局 token 预算上限（单位：千tokens）。0 表示不限制。
# 示例：设为 500 表示最多消耗 500k tokens，约等于 DeepSeek V3 花费 ~1元
token_budget_k: 0

# 单个阶段 token 上限（千tokens）。0 表示不限制。
# 超过则跳过该阶段并警告
per_phase_limit_k: 50

# 修订循环的单章 token 上限（千tokens）
# 防止某章反复修订烧钱
per_chapter_revision_limit_k: 30

# 是否在每次 API 调用前显示预估消耗
# 设为 true 会让你看到每次调用大概花多少钱
show_cost_estimate: true
